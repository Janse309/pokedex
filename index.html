<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Pokedex</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standart.css">
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="./styles/pkmn-card.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/dialog.css">
    <link rel="stylesheet" href="./styles/variable.css">

    <script src="./scripts/template.js" defer></script>
    <script src="./scripts/search.js" defer></script>
    <script src="./script.js" defer></script>

    <link rel="icon" type="image/x-icon" href="./assets/icon/fav-icon-zeiger.png">
</head>

<body onload="init()">

    <header class="pokedex-header">
        <section class="pokedex-header-content content-wrapper">
            <div class="headline-section">
                <h1 class="page-headline">Pokedex</h1>
                <p class="page-headline-text">catch them all</p>
            </div>

            <form class="search-section" onsubmit="event.preventDefault();">
                <input data-id="search-input" id="search-input-field" class="search-input" type="text"
                    placeholder="search pokemon">
                <button data-id="search-button" id="search-icon" class="search-btn" type="button">
                    <img src="./assets/icon/Vector.svg" alt="search">
                </button>
            </form>
        </section>
    </header>


    <main data-id="content">

        <section class="content-wrapper">
            <div class="pokemon-main-content" id="pokedex-gallery"></div>

            <div class="center-button" id="load-more-pokemon">
                <button data-id="load-more-button" id="load-more-button" class="load-more-and-reset-btn" onclick="loadPokemon()">Load more</button>
            </div>

            <dialog data-id="dialog" class="pokemon-dialog" id="pokemon-dialog" onclick="outsideClick(event)"></dialog>
        </section>

    </main>

    <footer class="pokedex-footer">
        <section class="content-wrapper">

            <img class="footer-img" src="./assets/img/pokeball.png" alt="Developer Akadmie Logo">

        </section>


    </footer>

</body>

</html>
