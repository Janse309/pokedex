<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Pokedex</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standart.css">
    <link rel="stylesheet" href="./styles/backgroundcolors.css">
    <link rel="stylesheet" href="./styles/pkmn-card.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/assets.css">

    <script src="./scripts/template.js"></script>
    <script src="./script.js"></script>
    <link rel="icon" type="image/x-icon" href="./assets/icon/fav-icon-zeiger.png">
</head>

<body onload="init()">

    <header class="pokedex-header">
        <section class="pokedex-header-content content-wrapper">
            <div>
                <h1 class="page-headline">Pokedex</h1>
            </div>
            <div class="search-section">
                <input class="search-input" type="text" id="search-input" placeholder="pokémon name or ID">
                <button class="search-btn"><img src="./assets/icon/Vector.svg" alt="search"></button>
            </div>
        </section>   
    </header>


    <main>

        <section class="content-wrapper">

            <div class="pokemon-main-content" id="pokedex-gallery"></div>
            <div class="center-button">
                <button class="load-more-button" onclick="loadPokemon()">load more</button>
            </div>
        </section>





    </main>

    <footer><a target="_blank" href="https://icons8.com/icon/1X9wUcuHxlS2/pokemon-pointer">Zeiger</a> icon by <a
            target="_blank" href="https://icons8.com">Icons8</a></footer>
</body>

</html>
